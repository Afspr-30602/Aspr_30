<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="theme-color"
    content="#0f766e">

  <title>Xuất Cuộn Giấy</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
    }

    .header p {
      margin: 7px 0 0;
      color: #6b7280;
      font-size: 15px;
    }

    .card {
      margin-bottom: 16px;
      padding: 18px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    .card-title {
      margin-bottom: 16px;
      font-size: 20px;
      font-weight: 800;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
    }

    .scan-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .button {
      width: 100%;
      min-height: 52px;
      padding: 12px;
      border: none;
      border-radius: 13px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .button-primary {
      background: #2563eb;
    }

    .button-warning {
      background: #d97706;
    }

    .button-success {
      background: #16a34a;
    }

    .button-secondary {
      background: #6b7280;
    }

    .button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .field {
      margin-bottom: 15px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #374151;
      font-size: 15px;
      font-weight: 800;
    }

    .fixed-value,
    .field input,
    .field textarea {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      background: #ffffff;
      color: #111827;
      font-size: 17px;
      outline: none;
    }

    .fixed-value {
      display: flex;
      align-items: center;
      background: #f3f4f6;
      word-break: break-word;
    }

    .fixed-value.empty {
      color: #9ca3af;
    }

    .readonly {
      background: #f3f4f6 !important;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: #2563eb;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .status {
      margin-top: 15px;
      padding: 11px;
      border-radius: 11px;
      background: #f3f4f6;
      color: #6b7280;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
    }

    .message {
      display: none;
      margin-bottom: 16px;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-size: 15px;
      font-weight: 800;
    }

    .message-success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .message-error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .submit-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .required {
      color: #dc2626;
    }

    @media (max-width: 420px) {
      .submit-controls {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">
      <h1>📦 XUẤT CUỘN GIẤY</h1>
      <p>Quản lý thông tin xuất cuộn</p>
    </header>

    <div
      id="message"
      class="message">
    </div>

    <section class="card">

      <div class="card-title">
        📷 Quét mã QR
      </div>

      <div id="reader"></div>

      <div class="scan-controls">

        <button
          id="scanButton"
          class="button button-primary"
          type="button">
          📷 BẮT ĐẦU QUÉT
        </button>

        <button
          id="flashButton"
          class="button button-warning"
          type="button"
          disabled>
          🔦 BẬT ĐÈN
        </button>

      </div>

    </section>

    <section class="card">

      <div class="card-title">
        📋 Thông tin xuất cuộn
      </div>

      <div class="field">

        <label>
          Thời gian xuất
        </label>

        <input
          id="thoiGian"
          class="readonly"
          type="text"
          readonly>

      </div>

      <div class="field">

        <label>
          Mã cuộn
        </label>

        <div
          id="maCuon"
          class="fixed-value empty">
          Chưa quét QR
        </div>

      </div>

      <div class="field">

        <label>
          Nhà cung cấp
        </label>

        <div
          id="nhaCungCap"
          class="fixed-value empty">
          Chưa quét QR
        </div>

      </div>

      <div class="field">

        <label>
          Định lượng
        </label>

        <div
          id="dinhLuong"
          class="fixed-value empty">
          Chưa quét QR
        </div>

      </div>

      <div class="field">

        <label>
          Vị trí cuộn (sau chạy)
          <span class="required">*</span>
        </label>

        <input
          id="viTri"
          type="text"
          autocomplete="off"
          placeholder="Nhập vị trí cuộn">

      </div>

      <div class="field">

        <label>
          Khối lượng cuộn (sau chạy)
          <span class="required">*</span>
        </label>

        <input
          id="khoiLuong"
          type="number"
          inputmode="decimal"
          step="0.01"
          autocomplete="off"
          placeholder="Nhập khối lượng">

      </div>

      <div class="field">

        <label>
          Ghi chú
        </label>

        <textarea
          id="ghiChu"
          autocomplete="off"
          placeholder="Nhập ghi chú nếu có">
        </textarea>

      </div>

      <div
        id="status"
        class="status">
        Sẵn sàng
      </div>

      <div class="submit-controls">

        <button
          id="rescanButton"
          class="button button-secondary"
          type="button">
          🔄 QUÉT LẠI
        </button>

        <button
          id="submitButton"
          class="button button-success"
          type="button">
          ✅ XÁC NHẬN XUẤT
        </button>

      </div>

    </section>

  </main>

  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbzQT86o89pHjzGeTRd36U87nxyKE7ztHP-zfzZlkVc1Z9M7NhsjD4UabcCKQlXHEGjKQw/exec";

    const state = {
      scanner: null,
      scanning: false,
      torchSupported: false,
      torchOn: false,
      submitting: false,
      maCuon: "",
      nhaCungCap: "",
      dinhLuong: ""
    };

    const el = {
      message: document.getElementById("message"),
      reader: document.getElementById("reader"),
      scanButton: document.getElementById("scanButton"),
      flashButton: document.getElementById("flashButton"),
      thoiGian: document.getElementById("thoiGian"),
      maCuon: document.getElementById("maCuon"),
      nhaCungCap: document.getElementById("nhaCungCap"),
      dinhLuong: document.getElementById("dinhLuong"),
      viTri: document.getElementById("viTri"),
      khoiLuong: document.getElementById("khoiLuong"),
      ghiChu: document.getElementById("ghiChu"),
      status: document.getElementById("status"),
      rescanButton: document.getElementById("rescanButton"),
      submitButton: document.getElementById("submitButton")
    };

    function updateTime() {

      const now = new Date();

      el.thoiGian.value =
        now.toLocaleString("vi-VN", {
          timeZone: "Asia/Ho_Chi_Minh",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        });

    }

    function showMessage(message, type) {

      el.message.textContent = message;

      el.message.className =
        "message " + type;

    }

    function clearMessage() {

      el.message.textContent = "";

      el.message.className = "message";

    }

    function setStatus(message) {

      el.status.textContent = message;

    }

    function setField(element, value) {

      if (value) {

        element.textContent = value;

        element.classList.remove("empty");

      } else {

        element.textContent =
          "Chưa quét QR";

        element.classList.add("empty");

      }

    }

    function createRequestId() {

      return (
        Date.now().toString(36) +
        "-" +
        Math.random()
          .toString(36)
          .substring(2, 14)
      );

    }

    function jsonpRequest(params) {

      return new Promise(
        (resolve, reject) => {

          const callbackName =
            "qr_" +
            Date.now() +
            "_" +
            Math.random()
              .toString(36)
              .substring(2, 10);

          const script =
            document.createElement("script");

          let finished = false;

          const timeout =
            setTimeout(() => {

              if (finished) return;

              finished = true;

              cleanup();

              reject(
                new Error(
                  "Máy chủ không phản hồi."
                )
              );

            }, 15000);

          function cleanup() {

            clearTimeout(timeout);

            try {
              delete window[callbackName];
            } catch (error) {
              window[callbackName] =
                undefined;
            }

            if (script.parentNode) {
              script.parentNode
                .removeChild(script);
            }

          }

          window[callbackName] =
            function(result) {

              if (finished) return;

              finished = true;

              cleanup();

              resolve(result);

            };

          const query =
            new URLSearchParams({
              ...params,
              callback: callbackName
            });

          script.src =
            API_URL +
            "?" +
            query.toString();

          script.onerror =
            function() {

              if (finished) return;

              finished = true;

              cleanup();

              reject(
                new Error(
                  "Không thể kết nối máy chủ."
                )
              );

            };

          document.body
            .appendChild(script);

        }
      );

    }

    async function startScanner() {

      if (
        state.scanning ||
        state.submitting
      ) {
        return;
      }

      clearMessage();

      try {

        if (state.scanner) {

          try {
            await state.scanner.clear();
          } catch (error) {
          }

          state.scanner = null;
        }

        state.scanner =
          new Html5Qrcode("reader");

        await state.scanner.start(
          {
            facingMode: "environment"
          },
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },
          onScanSuccess,
          onScanFailure
        );

        state.scanning = true;
        state.torchOn = false;

        el.scanButton.textContent =
          "📷 ĐANG QUÉT...";

        el.scanButton.disabled = true;

        setStatus(
          "Đang chờ mã QR..."
        );

        await detectTorch();

      } catch (error) {

        console.error(error);

        state.scanning = false;

        el.scanButton.textContent =
          "📷 BẮT ĐẦU QUÉT";

        el.scanButton.disabled =
          false;

        el.flashButton.disabled =
          true;

        setStatus(
          "Không thể mở camera"
        );

        showMessage(
          "Không thể mở camera. Hãy kiểm tra quyền camera của trình duyệt.",
          "message-error"
        );

      }

    }

    async function detectTorch() {

      try {

        const capabilities =
          state.scanner
            .getRunningTrackCapabilities();

        state.torchSupported =
          capabilities &&
          capabilities.torch === true;

        el.flashButton.disabled =
          !state.torchSupported;

        el.flashButton.textContent =
          state.torchSupported
            ? "🔦 BẬT ĐÈN"
            : "🔦 ĐÈN KHÔNG HỖ TRỢ";

      } catch (error) {

        state.torchSupported = false;

        el.flashButton.disabled = true;

        el.flashButton.textContent =
          "🔦 ĐÈN KHÔNG HỖ TRỢ";

      }

    }

    async function toggleFlash() {

      if (
        !state.scanning ||
        !state.torchSupported
      ) {
        return;
      }

      const next =
        !state.torchOn;

      try {

        await state.scanner
          .applyVideoConstraints({
            advanced: [
              {
                torch: next
              }
            ]
          });

        state.torchOn = next;

        el.flashButton.textContent =
          next
            ? "🔦 TẮT ĐÈN"
            : "🔦 BẬT ĐÈN";

      } catch (error) {

        showMessage(
          "Thiết bị không cho phép điều khiển đèn camera.",
          "message-error"
        );

      }

    }

    function onScanFailure() {
    }

    async function onScanSuccess(decodedText) {

      if (!state.scanning) {
        return;
      }

      state.scanning = false;

      try {
        await state.scanner.stop();
      } catch (error) {
      }

      el.flashButton.disabled = true;

      state.torchOn = false;

      el.scanButton.textContent =
        "📷 QUÉT MÃ KHÁC";

      el.scanButton.disabled = false;

      const parts =
        decodedText
          .split("|")
          .map(value =>
            value.trim()
          );

      if (parts.length !== 3) {

        setStatus(
          "QR không hợp lệ"
        );

        showMessage(
          "QR phải có dạng: Mã cuộn | Nhà cung cấp | Định lượng.",
          "message-error"
        );

        return;
      }

      const [
        maCuon,
        nhaCungCap,
        dinhLuong
      ] = parts;

      if (
        !maCuon ||
        !nhaCungCap ||
        !dinhLuong
      ) {

        setStatus(
          "QR thiếu thông tin"
        );

        showMessage(
          "QR đang thiếu thông tin.",
          "message-error"
        );

        return;
      }

      state.maCuon =
        maCuon;

      state.nhaCungCap =
        nhaCungCap;

      state.dinhLuong =
        dinhLuong;

      setField(
        el.maCuon,
        maCuon
      );

      setField(
        el.nhaCungCap,
        nhaCungCap
      );

      setField(
        el.dinhLuong,
        dinhLuong
      );

      updateTime();

      setStatus(
        "Đã quét QR. Vui lòng nhập thông tin xuất."
      );

      el.viTri.focus();

    }

    function validate() {

      if (
        !state.maCuon ||
        !state.nhaCungCap ||
        !state.dinhLuong
      ) {

        showMessage(
          "Vui lòng quét mã QR trước.",
          "message-error"
        );

        return false;
      }

      if (
        !el.viTri.value.trim()
      ) {

        showMessage(
          "Vui lòng nhập vị trí cuộn.",
          "message-error"
        );

        el.viTri.focus();

        return false;
      }

      if (
        !el.khoiLuong.value.trim()
      ) {

        showMessage(
          "Vui lòng nhập khối lượng cuộn.",
          "message-error"
        );

        el.khoiLuong.focus();

        return false;
      }

      return true;

    }

    async function submitData() {

      if (
        state.submitting ||
        !validate()
      ) {
        return;
      }

      state.submitting = true;

      const requestId =
        createRequestId();

      el.submitButton.disabled = true;

      el.rescanButton.disabled = true;

      el.submitButton.textContent =
        "ĐANG LƯU...";

      clearMessage();

      setStatus(
        "Đang gửi dữ liệu..."
      );

      try {

        const result =
          await jsonpRequest({

            action: "submit",

            requestId:
              requestId,

            maCuon:
              state.maCuon,

            nhaCungCap:
              state.nhaCungCap,

            dinhLuong:
              state.dinhLuong,

            viTri:
              el.viTri.value.trim(),

            khoiLuong:
              el.khoiLuong.value.trim(),

            ghiChu:
              el.ghiChu.value.trim()

          });

        if (
          !result ||
          result.success !== true
        ) {

          throw new Error(
            result &&
            result.message
              ? result.message
              : "Máy chủ từ chối dữ liệu."
          );

        }

        showMessage(
          result.duplicate
            ? "Giao dịch này đã được ghi trước đó."
            : "✅ XUẤT CUỘN THÀNH CÔNG",
          "message-success"
        );

        resetForm();

        setStatus(
          "Hoàn tất. Sẵn sàng quét cuộn tiếp theo."
        );

      } catch (error) {

        console.error(error);

        setStatus(
          "Gửi dữ liệu thất bại"
        );

        showMessage(
          error.message ||
          "Không thể gửi dữ liệu.",
          "message-error"
        );

      } finally {

        state.submitting =
          false;

        el.submitButton.disabled =
          false;

        el.rescanButton.disabled =
          false;

        el.submitButton.textContent =
          "✅ XÁC NHẬN XUẤT";

      }

    }

    async function rescan() {

      if (state.submitting) {
        return;
      }

      if (
        state.scanning &&
        state.scanner
      ) {

        try {
          await state.scanner.stop();
        } catch (error) {
        }

        state.scanning = false;

      }

      if (state.scanner) {

        try {
          await state.scanner.clear();
        } catch (error) {
        }

        state.scanner = null;

      }

      state.torchOn = false;

      state.torchSupported =
        false;

      state.maCuon = "";
      state.nhaCungCap = "";
      state.dinhLuong = "";

      setField(
        el.maCuon,
        ""
      );

      setField(
        el.nhaCungCap,
        ""
      );

      setField(
        el.dinhLuong,
        ""
      );

      el.viTri.value = "";
      el.khoiLuong.value = "";
      el.ghiChu.value = "";

      el.flashButton.disabled =
        true;

      el.flashButton.textContent =
        "🔦 BẬT ĐÈN";

      el.scanButton.disabled =
        false;

      el.scanButton.textContent =
        "📷 BẮT ĐẦU QUÉT";

      clearMessage();

      updateTime();

      setStatus(
        "Sẵn sàng quét lại."
      );

      el.reader.innerHTML = "";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }

    updateTime();

    setInterval(
      updateTime,
      1000
    );

    el.scanButton
      .addEventListener(
        "click",
        startScanner
      );

    el.flashButton
      .addEventListener(
        "click",
        toggleFlash
      );

    el.submitButton
      .addEventListener(
        "click",
        submitData
      );

    el.rescanButton
      .addEventListener(
        "click",
        rescan
      );

  </script>

</body>
</html>
