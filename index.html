<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>Xuất Cuộn Giấy</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 16px;
    }

    .header {
      margin-bottom: 16px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    .header p {
      margin: 6px 0 0;
      color: #6b7280;
      font-size: 14px;
    }

    .card {
      margin-bottom: 16px;
      padding: 16px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    .card-title {
      margin-bottom: 14px;
      font-size: 18px;
      font-weight: 700;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    .button {
      width: 100%;
      min-height: 50px;
      margin-top: 12px;
      padding: 12px 16px;
      border: 0;
      border-radius: 12px;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .button-primary {
      background: #2563eb;
    }

    .button-success {
      background: #16a34a;
    }

    .button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .field {
      margin-bottom: 14px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: #374151;
      font-size: 14px;
      font-weight: 700;
    }

    .fixed-value,
    .field input,
    .field textarea {
      width: 100%;
      min-height: 46px;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: #ffffff;
      color: #111827;
      font-size: 16px;
      outline: none;
    }

    .fixed-value {
      display: flex;
      align-items: center;
      background: #f3f4f6;
      word-break: break-word;
    }

    .fixed-value.empty {
      color: #9ca3af;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: #2563eb;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .readonly {
      background: #f3f4f6 !important;
      color: #374151 !important;
    }

    .status {
      margin-bottom: 16px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f3f4f6;
      color: #6b7280;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
    }

    .message {
      display: none;
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
    }

    .message-success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .message-error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .required {
      color: #dc2626;
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="header">
      <h1>📦 XUẤT CUỘN GIẤY</h1>
      <p>Quản lý thông tin xuất cuộn</p>
    </header>

    <div id="message" class="message"></div>

    <section class="card">
      <div class="card-title">📷 Quét mã QR</div>

      <div id="reader"></div>

      <button
        id="scanButton"
        class="button button-primary"
        type="button">
        📷 BẮT ĐẦU QUÉT
      </button>
    </section>

    <section class="card">
      <div class="card-title">📋 Thông tin xuất cuộn</div>

      <div class="field">
        <label>Thời gian xuất</label>
        <input
          id="thoiGian"
          class="readonly"
          type="text"
          readonly>
      </div>

      <div class="field">
        <label>Mã cuộn</label>
        <div id="maCuon" class="fixed-value empty">Chưa quét QR</div>
      </div>

      <div class="field">
        <label>Nhà cung cấp</label>
        <div id="nhaCungCap" class="fixed-value empty">Chưa quét QR</div>
      </div>

      <div class="field">
        <label>Định lượng</label>
        <div id="dinhLuong" class="fixed-value empty">Chưa quét QR</div>
      </div>

      <div class="field">
        <label for="viTri">
          Vị trí cuộn (sau chạy) <span class="required">*</span>
        </label>
        <input
          id="viTri"
          type="text"
          autocomplete="off"
          placeholder="Nhập vị trí cuộn">
      </div>

      <div class="field">
        <label for="khoiLuong">
          Khối lượng cuộn (sau chạy) <span class="required">*</span>
        </label>
        <input
          id="khoiLuong"
          type="number"
          inputmode="decimal"
          step="0.01"
          autocomplete="off"
          placeholder="Nhập khối lượng">
      </div>

      <div class="field">
        <label for="ghiChu">Ghi chú</label>
        <textarea
          id="ghiChu"
          autocomplete="off"
          placeholder="Nhập ghi chú nếu có"></textarea>
      </div>

      <div id="status" class="status">
        Sẵn sàng
      </div>

      <button
        id="submitButton"
        class="button button-success"
        type="button">
        XÁC NHẬN XUẤT
      </button>
    </section>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzZJdnph_VR-Msg50Sj1BiNzgb3UjwQPUKW8F3sPjEcMboiFDOxfMLXdHc-LvTK5rIt4w/exec";

    const state = {
      scanner: null,
      scanning: false,
      submitting: false,
      requestId: "",
      maCuon: "",
      nhaCungCap: "",
      dinhLuong: ""
    };

    const elements = {
      message: document.getElementById("message"),
      reader: document.getElementById("reader"),
      scanButton: document.getElementById("scanButton"),
      thoiGian: document.getElementById("thoiGian"),
      maCuon: document.getElementById("maCuon"),
      nhaCungCap: document.getElementById("nhaCungCap"),
      dinhLuong: document.getElementById("dinhLuong"),
      viTri: document.getElementById("viTri"),
      khoiLuong: document.getElementById("khoiLuong"),
      ghiChu: document.getElementById("ghiChu"),
      status: document.getElementById("status"),
      submitButton: document.getElementById("submitButton")
    };

    function updateTime() {
      const now = new Date();

      elements.thoiGian.value =
        now.toLocaleString("vi-VN", {
          timeZone: "Asia/Ho_Chi_Minh",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        });
    }

    function showMessage(message, type) {
      elements.message.textContent = message;
      elements.message.className = "message " + type;
    }

    function clearMessage() {
      elements.message.textContent = "";
      elements.message.className = "message";
    }

    function setStatus(message) {
      elements.status.textContent = message;
    }

    function setScanButton(text, disabled) {
      elements.scanButton.textContent = text;
      elements.scanButton.disabled = disabled;
    }

    function createRequestId() {
      return (
        Date.now().toString(36) +
        "-" +
        Math.random().toString(36).substring(2, 12)
      );
    }

    async function startScanner() {
      if (state.scanning || state.submitting) {
        return;
      }

      clearMessage();

      if (state.scanner) {
        try {
          await state.scanner.clear();
        } catch (error) {
          console.error(error);
        }
      }

      state.scanner = new Html5Qrcode("reader");

      try {
        await state.scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },
          handleScanSuccess,
          handleScanFailure
        );

        state.scanning = true;
        setScanButton("📷 ĐANG QUÉT...", true);
        setStatus("Đang chờ mã QR...");
      } catch (error) {
        console.error(error);

        state.scanning = false;

        setScanButton("📷 BẮT ĐẦU QUÉT", false);

        setStatus("Không thể mở camera");

        showMessage(
          "Không thể mở camera. Vui lòng cấp quyền camera cho trình duyệt.",
          "message-error"
        );
      }
    }

    function handleScanFailure() {
      return;
    }

    async function handleScanSuccess(decodedText) {
      if (!state.scanning) {
        return;
      }

      state.scanning = false;

      try {
        await state.scanner.stop();
      } catch (error) {
        console.error(error);
      }

      setScanButton("📷 QUÉT MÃ KHÁC", false);

      const parts = decodedText
        .split("|")
        .map(value => value.trim());

      if (parts.length !== 3) {
        setStatus("QR không hợp lệ");

        showMessage(
          "QR không đúng định dạng. Cần: Mã cuộn | Nhà cung cấp | Định lượng.",
          "message-error"
        );

        return;
      }

      const [maCuon, nhaCungCap, dinhLuong] = parts;

      if (!maCuon || !nhaCungCap || !dinhLuong) {
        setStatus("QR thiếu thông tin");

        showMessage(
          "QR đang thiếu thông tin.",
          "message-error"
        );

        return;
      }

      state.maCuon = maCuon;
      state.nhaCungCap = nhaCungCap;
      state.dinhLuong = dinhLuong;

      elements.maCuon.textContent = maCuon;
      elements.nhaCungCap.textContent = nhaCungCap;
      elements.dinhLuong.textContent = dinhLuong;

      elements.maCuon.classList.remove("empty");
      elements.nhaCungCap.classList.remove("empty");
      elements.dinhLuong.classList.remove("empty");

      updateTime();

      setStatus("Đã quét QR. Vui lòng nhập thông tin xuất.");

      elements.viTri.focus();

      elements.viTri.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    }

    function validateForm() {
      if (!state.maCuon || !state.nhaCungCap || !state.dinhLuong) {
        showMessage(
          "Vui lòng quét mã QR trước khi xác nhận.",
          "message-error"
        );

        return false;
      }

      if (!elements.viTri.value.trim()) {
        showMessage(
          "Vui lòng nhập vị trí cuộn.",
          "message-error"
        );

        elements.viTri.focus();

        return false;
      }

      if (!elements.khoiLuong.value.trim()) {
        showMessage(
          "Vui lòng nhập khối lượng cuộn.",
          "message-error"
        );

        elements.khoiLuong.focus();

        return false;
      }

      return true;
    }

    function checkServerStatus(requestId) {
      return new Promise(resolve => {
        const callbackName =
          "qrCallback_" +
          Date.now() +
          "_" +
          Math.random().toString(36).substring(2, 8);

        const script = document.createElement("script");

        const timeout = setTimeout(() => {
          cleanup();
          resolve(null);
        }, 5000);

        function cleanup() {
          clearTimeout(timeout);

          if (window[callbackName]) {
            delete window[callbackName];
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        window[callbackName] = result => {
          cleanup();
          resolve(result);
        };

        script.src =
          API_URL +
          "?requestId=" +
          encodeURIComponent(requestId) +
          "&callback=" +
          encodeURIComponent(callbackName);

        script.onerror = () => {
          cleanup();
          resolve(null);
        };

        document.body.appendChild(script);
      });
    }

    async function waitForServerConfirmation(requestId) {
      for (let attempt = 0; attempt < 6; attempt++) {
        const result =
          await checkServerStatus(requestId);

        if (result && result.success) {
          return true;
        }

        await new Promise(resolve => {
          setTimeout(resolve, 1000);
        });
      }

      return false;
    }

    async function submitData() {
      if (state.submitting || !validateForm()) {
        return;
      }

      state.submitting = true;
      state.requestId = createRequestId();

      elements.submitButton.disabled = true;
      elements.submitButton.textContent = "ĐANG LƯU...";

      setStatus("Đang gửi dữ liệu...");

      const payload = {
        requestId: state.requestId,
        maCuon: state.maCuon,
        nhaCungCap: state.nhaCungCap,
        dinhLuong: state.dinhLuong,
        viTri: elements.viTri.value.trim(),
        khoiLuong: elements.khoiLuong.value.trim(),
        ghiChu: elements.ghiChu.value.trim()
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        const confirmed =
          await waitForServerConfirmation(
            state.requestId
          );

        if (!confirmed) {
          throw new Error(
            "Máy chủ chưa xác nhận giao dịch."
          );
        }

        showMessage(
          "Đã xuất cuộn thành công.",
          "message-success"
        );

        setStatus("Hoàn tất. Sẵn sàng quét cuộn tiếp theo.");

        resetForm();

      } catch (error) {
        console.error(error);

        setStatus("Gửi dữ liệu thất bại");

        showMessage(
          "Không nhận được xác nhận từ máy chủ. Vui lòng kiểm tra Google Sheet trước khi gửi lại.",
          "message-error"
        );
      } finally {
        state.submitting = false;
        elements.submitButton.disabled = false;
        elements.submitButton.textContent =
          "XÁC NHẬN XUẤT";
      }
    }

    function resetForm() {
      state.requestId = "";
      state.maCuon = "";
      state.nhaCungCap = "";
      state.dinhLuong = "";

      elements.maCuon.textContent = "Chưa quét QR";
      elements.nhaCungCap.textContent = "Chưa quét QR";
      elements.dinhLuong.textContent = "Chưa quét QR";

      elements.maCuon.classList.add("empty");
      elements.nhaCungCap.classList.add("empty");
      elements.dinhLuong.classList.add("empty");

      elements.viTri.value = "";
      elements.khoiLuong.value = "";
      elements.ghiChu.value = "";

      updateTime();
    }

    updateTime();

    setInterval(updateTime, 1000);

    elements.scanButton.addEventListener(
      "click",
      startScanner
    );

    elements.submitButton.addEventListener(
      "click",
      submitData
    );
  </script>
</body>
</html>
