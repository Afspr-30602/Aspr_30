<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Xuất Cuộn QR</title>
<script src="https://unpkg.com/html5-qrcode" defer></script>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
min-height:100%;
font-family:Arial,sans-serif;
background:#eef2f7;
color:#172033
}

body{
padding:16px
}

.app{
width:100%;
max-width:620px;
margin:0 auto
}

.card{
background:#fff;
border-radius:20px;
padding:18px;
box-shadow:0 8px 30px rgba(15,23,42,.10);
margin-bottom:14px
}

h1{
font-size:24px;
text-align:center;
margin:4px 0 18px
}

h2{
font-size:17px;
margin:0 0 14px
}

.section-title{
font-weight:800;
font-size:15px;
margin:18px 0 10px
}

.camera-card{
padding:14px
}

.camera-box{
position:relative;
width:100%;
max-width:520px;
margin:0 auto;
border-radius:16px;
overflow:hidden;
background:#0b1220;
aspect-ratio:4/3;
isolation:isolate
}

#reader{
position:absolute;
inset:0;
width:100%!important;
height:100%!important;
overflow:hidden!important
}

#reader video{
position:absolute!important;
inset:0!important;
width:100%!important;
height:100%!important;
object-fit:cover!important
}

#reader__scan_region{
width:100%!important;
height:100%!important;
min-height:0!important;
display:flex!important;
align-items:center!important;
justify-content:center!important;
overflow:hidden!important
}

#reader__scan_region img{
max-width:100%!important
}

#reader__dashboard{
display:none!important
}

#reader__status_span{
display:none!important
}

.scan-frame{
position:absolute;
left:16%;
top:16%;
width:68%;
height:68%;
border:3px solid #22c55e;
border-radius:18px;
pointer-events:none;
z-index:4;
box-shadow:0 0 0 999px rgba(0,0,0,.18)
}

.flash-btn{
display:block;
width:100%;
margin:10px 0 0;
border:0;
border-radius:16px;
padding:15px;
background:#374151;
color:#fff;
font-size:17px;
font-weight:800;
cursor:pointer
}

.flash-btn:disabled{
opacity:.65;
cursor:not-allowed
}

.camera-status{
text-align:center;
font-size:13px;
color:#64748b;
margin:10px 0 2px;
min-height:18px
}

button{
border:0;
border-radius:12px;
padding:13px 15px;
font-size:14px;
font-weight:800;
cursor:pointer
}

.primary{
background:#2563eb;
color:#fff;
width:100%
}

.success{
background:#16a34a;
color:#fff
}

.secondary{
background:#e2e8f0;
color:#172033
}

button:disabled{
opacity:.55;
cursor:not-allowed
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.field{
display:flex;
flex-direction:column;
gap:6px
}

.field.full{
grid-column:1/-1
}

label{
font-size:13px;
font-weight:800;
color:#475569
}

input,textarea{
width:100%;
border:1px solid #cbd5e1;
border-radius:10px;
padding:11px 12px;
font-size:15px;
background:#fff;
color:#172033;
outline:none
}

input:focus,textarea:focus{
border-color:#2563eb;
box-shadow:0 0 0 3px rgba(37,99,235,.10)
}

input[readonly]{
background:#f1f5f9;
color:#334155
}

textarea{
min-height:78px;
resize:vertical
}

.actions{
display:flex;
flex-direction:column;
gap:10px;
margin-top:18px
}

.actions button{
width:100%
}

.hidden{
display:none!important
}

.message{
border-radius:12px;
padding:11px 12px;
font-size:14px;
line-height:1.4;
margin-top:12px
}

.message.success-msg{
background:#dcfce7;
color:#166534
}

.message.error-msg{
background:#fee2e2;
color:#991b1b
}

.message.info-msg{
background:#dbeafe;
color:#1e40af
}

@media(max-width:520px){

body{
padding:10px
}

.card{
padding:14px;
border-radius:16px
}

.form-grid{
grid-template-columns:1fr
}

.field.full{
grid-column:auto
}

.camera-box{
aspect-ratio:4/3
}

}
</style>
</head>

<body>

<div class="app">

<div class="card">

<h1>📦 XUẤT CUỘN QR</h1>

<div id="scannerCard" class="camera-card">

<div id="cameraBox" class="camera-box">

<div id="reader"></div>

<div class="scan-frame"></div>

</div>

<button id="flashBtn" class="flash-btn hidden" type="button">
🔦 BẬT FLASH
</button>

<div id="cameraStatus" class="camera-status">
Sẵn sàng quét mã cuộn
</div>

<button id="startBtn" class="primary" type="button">
📷 BẮT ĐẦU QUÉT
</button>

</div>

</div>

<div id="formCard" class="card hidden">

<h2>Thông tin cuộn</h2>

<div class="section-title">
Thông tin từ mã QR
</div>

<div class="form-grid">

<div class="field">

<label>Mã cuộn</label>

<input id="maCuon" type="text" readonly>

</div>

<div class="field">

<label>Nhà cung cấp</label>

<input id="nhaCungCap" type="text" readonly>

</div>

<div class="field">

<label>Định lượng</label>

<input id="dinhLuong" type="text" readonly>

</div>

<div class="field">

<label>Khổ giấy</label>

<input id="khoGiay" type="text" readonly>

</div>

</div>

<div class="section-title">
Thông tin sau khi chạy
</div>

<div class="form-grid">

<div class="field">

<label for="viTri">
Vị trí cuộn (sau chạy) *
</label>

<input
id="viTri"
type="text"
autocomplete="off"
placeholder="Nhập vị trí cuộn"
>

</div>

<div class="field">

<label for="khoiLuong">
Khối lượng cuộn (sau chạy) *
</label>

<input
id="khoiLuong"
type="text"
inputmode="decimal"
autocomplete="off"
placeholder="Nhập khối lượng"
>

</div>

<div class="field full">

<label for="nguoiGap">
Người gắp giấy *
</label>

<input
id="nguoiGap"
type="text"
autocomplete="name"
placeholder="Nhập người gắp giấy"
>

</div>

<div class="field full">

<label for="ghiChu">
Ghi chú
</label>

<textarea
id="ghiChu"
placeholder="Nhập ghi chú nếu có"
></textarea>

</div>

</div>

<div id="message" class="message hidden"></div>

<div class="actions">

<button
id="submitBtn"
class="success"
type="button"
>
✓ XÁC NHẬN XUẤT
</button>

<button
id="newRollBtn"
class="secondary"
type="button"
>
📷 QUÉT CUỘN TIẾP THEO
</button>

</div>

</div>

</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbzQT86o89pHjzGeTRd36U87nxyKE7ztHP-zfzZlkVc1Z9M7NhsjD4UabcCKQlXHEGjKQw/exec";

let scanner=null;
let scanning=false;
let torchOn=false;
let currentRequestId="";
let submitted=false;
let starting=false;

const startBtn=document.getElementById("startBtn");
const flashBtn=document.getElementById("flashBtn");
const cameraStatus=document.getElementById("cameraStatus");
const formCard=document.getElementById("formCard");
const message=document.getElementById("message");
const submitBtn=document.getElementById("submitBtn");
const newRollBtn=document.getElementById("newRollBtn");

const fields={
maCuon:document.getElementById("maCuon"),
nhaCungCap:document.getElementById("nhaCungCap"),
dinhLuong:document.getElementById("dinhLuong"),
khoGiay:document.getElementById("khoGiay"),
viTri:document.getElementById("viTri"),
khoiLuong:document.getElementById("khoiLuong"),
nguoiGap:document.getElementById("nguoiGap"),
ghiChu:document.getElementById("ghiChu")
};

function makeRequestId(){

return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,12);

}

function setMessage(text,type){

message.textContent=text;

message.className=
"message "+
(
type==="success"
?"success-msg"
:
type==="error"
?"error-msg"
:
"info-msg"
);

}

function hideMessage(){

message.className="message hidden";

message.textContent="";

}

function parseQr(text){

const parts=
String(text||"")
.split("|")
.map(v=>v.trim());

if(parts.length!==4){

throw new Error(
"Mã QR không đúng định dạng. Cần 4 thông tin: Mã cuộn | Nhà cung cấp | Định lượng | Khổ giấy."
);

}

if(parts.some(v=>!v)){

throw new Error(
"Mã QR đang thiếu thông tin."
);

}

return{

maCuon:parts[0],
nhaCungCap:parts[1],
dinhLuong:parts[2],
khoGiay:parts[3]

};

}

function resetForm(){

Object.values(fields).forEach(
el=>el.value=""
);

currentRequestId=makeRequestId();

submitted=false;

submitBtn.disabled=false;

newRollBtn.disabled=false;

hideMessage();

}

async function stopScanner(){

if(scanner){

try{

if(scanning)
await scanner.stop();

}catch(e){}

try{

await scanner.clear();

}catch(e){}

}

scanner=null;

scanning=false;

torchOn=false;

flashBtn.classList.add("hidden");

flashBtn.textContent="🔦 BẬT FLASH";

startBtn.disabled=false;

startBtn.textContent="📷 BẮT ĐẦU QUÉT";

}

async function startScanner(){

if(starting||scanning)
return;

if(typeof Html5Qrcode==="undefined"){

setMessage(
"Không tải được bộ quét QR. Hãy tải lại trang.",
"error"
);

return;

}

starting=true;

resetForm();

formCard.classList.add("hidden");

startBtn.disabled=true;

startBtn.textContent="ĐANG MỞ CAMERA...";

cameraStatus.textContent=
"Đang yêu cầu quyền camera...";

hideMessage();

try{

scanner=
new Html5Qrcode(
"reader",
{
verbose:false
}
);

await scanner.start(

{facingMode:{exact:"environment"}},

{

fps:10,

qrbox:function(
viewfinderWidth,
viewfinderHeight
){

const size=
Math.floor(
Math.min(
viewfinderWidth,
viewfinderHeight
)*0.62
);

return{
width:size,
height:size
};

},

aspectRatio:4/3

},

onScanSuccess,

onScanFailure

);

scanning=true;

starting=false;

startBtn.disabled=false;

startBtn.textContent="📷 ĐANG QUÉT";

cameraStatus.textContent=
"Đưa mã QR vào khung xanh";

flashBtn.classList.remove("hidden");

await detectTorch();

}catch(error){

try{

if(scanner)
await scanner.clear();

}catch(e){}

scanner=null;

scanning=false;

starting=false;

startBtn.disabled=false;

startBtn.textContent="📷 BẮT ĐẦU QUÉT";

flashBtn.classList.add("hidden");

cameraStatus.textContent=
"Không thể mở camera";

setMessage(
"Không mở được camera. Hãy cấp quyền camera cho trình duyệt rồi thử lại.",
"error"
);

}

}

async function detectTorch(){

try{

const video=
document.querySelector("#reader video");

if(!video||!video.srcObject){

flashBtn.disabled=true;

flashBtn.textContent=
"🔦 FLASH KHÔNG HỖ TRỢ";

return;

}

const track=
video.srcObject.getVideoTracks()[0];

if(!track){

flashBtn.disabled=true;

flashBtn.textContent=
"🔦 FLASH KHÔNG HỖ TRỢ";

return;

}

const capabilities=
track.getCapabilities
?
track.getCapabilities()
:
{};

if(!capabilities.torch){

flashBtn.disabled=true;

flashBtn.textContent=
"🔦 FLASH KHÔNG HỖ TRỢ";

return;

}

flashBtn.disabled=false;

flashBtn.textContent=
"🔦 BẬT FLASH";

}catch(e){

flashBtn.disabled=true;

flashBtn.textContent=
"🔦 FLASH KHÔNG HỖ TRỢ";

}

}

async function toggleTorch(){

if(!scanning||flashBtn.disabled)
return;

try{

const video=
document.querySelector("#reader video");

if(!video||!video.srcObject)
return;

const track=
video.srcObject.getVideoTracks()[0];

if(!track)
return;

const capabilities=
track.getCapabilities
?
track.getCapabilities()
:
{};

if(!capabilities.torch){

flashBtn.disabled=true;

flashBtn.textContent=
"🔦 FLASH KHÔNG HỖ TRỢ";

return;

}

torchOn=!torchOn;

await track.applyConstraints({

advanced:[
{
torch:torchOn
}
]

});

flashBtn.textContent=
torchOn
?
"🔦 TẮT FLASH"
:
"🔦 BẬT FLASH";

}catch(e){

torchOn=false;

flashBtn.textContent=
"🔦 BẬT FLASH";

setMessage(
"Thiết bị hoặc trình duyệt không cho phép điều khiển đèn flash.",
"error"
);

}

}

async function onScanSuccess(decodedText){

if(!scanning)
return;

let data;

try{

data=parseQr(decodedText);

}catch(error){

cameraStatus.textContent=
error.message;

return;

}

await stopScanner();

fields.maCuon.value=
data.maCuon;

fields.nhaCungCap.value=
data.nhaCungCap;

fields.dinhLuong.value=
data.dinhLuong;

fields.khoGiay.value=
data.khoGiay;

currentRequestId=
makeRequestId();

submitted=false;

formCard.classList.remove("hidden");

cameraStatus.textContent=
"Đã quét thành công";

setMessage(
"Đã đọc mã QR. Nhập thông tin sau khi chạy rồi xác nhận xuất.",
"success"
);

setTimeout(
()=>fields.viTri.focus(),
100
);

}

function onScanFailure(){

}

function jsonp(url){

return new Promise(
(resolve,reject)=>{

const callbackName=
"qrSubmit_"+
Date.now()+
"_"+Math.random()
.toString(36)
.slice(2);

const script=
document.createElement("script");

let finished=false;

const timer=
setTimeout(()=>{

if(finished)
return;

finished=true;

cleanup();

reject(
new Error(
"Hết thời gian chờ máy chủ."
)
);

},20000);

function cleanup(){

clearTimeout(timer);

delete window[callbackName];

if(script.parentNode)
script.parentNode.removeChild(script);

}

window[callbackName]=data=>{

if(finished)
return;

finished=true;

cleanup();

resolve(data);

};

script.onerror=()=>{

if(finished)
return;

finished=true;

cleanup();

reject(
new Error(
"Không kết nối được máy chủ."
)
);

};

script.src=
url+
"&callback="+
encodeURIComponent(callbackName)+
"&_="+
Date.now();

document.body.appendChild(script);

}
);

}

async function submitData(){

if(submitted)
return;

const maCuon=
fields.maCuon.value.trim();

const nhaCungCap=
fields.nhaCungCap.value.trim();

const dinhLuong=
fields.dinhLuong.value.trim();

const khoGiay=
fields.khoGiay.value.trim();

const viTri=
fields.viTri.value.trim();

const khoiLuong=
fields.khoiLuong.value.trim();

const nguoiGap=
fields.nguoiGap.value.trim();

const ghiChu=
fields.ghiChu.value.trim();

if(
!maCuon||
!nhaCungCap||
!dinhLuong||
!khoGiay
){

setMessage(
"Thiếu thông tin từ mã QR.",
"error"
);

return;

}

if(!viTri){

setMessage(
"Vui lòng nhập vị trí cuộn.",
"error"
);

fields.viTri.focus();

return;

}

if(!khoiLuong){

setMessage(
"Vui lòng nhập khối lượng cuộn.",
"error"
);

fields.khoiLuong.focus();

return;

}

if(!nguoiGap){

setMessage(
"Vui lòng nhập người gắp giấy.",
"error"
);

fields.nguoiGap.focus();

return;

}

submitBtn.disabled=true;

newRollBtn.disabled=true;

setMessage(
"Đang lưu dữ liệu...",
"info"
);

const params=
new URLSearchParams({

action:"submit",

requestId:
currentRequestId,

maCuon,

nhaCungCap,

dinhLuong,

khoGiay,

viTri,

khoiLuong,

nguoiGap,

ghiChu

});

try{

const result=
await jsonp(
API_URL+
"?"+
params.toString()
);

if(result&&result.success){

submitted=true;

setMessage(

result.duplicate
?
"Giao dịch này đã được ghi nhận trước đó."
:
"Đã xác nhận xuất cuộn thành công.",

"success"

);

submitBtn.disabled=true;

newRollBtn.disabled=false;

}else{

throw new Error(

result&&result.message
?
result.message
:
"Máy chủ không xác nhận lưu dữ liệu."

);

}

}catch(error){

submitted=false;

submitBtn.disabled=false;

newRollBtn.disabled=false;

setMessage(
error.message||
"Có lỗi khi lưu dữ liệu.",
"error"
);

}

}

async function newRoll(){

await stopScanner();

resetForm();

formCard.classList.add("hidden");

cameraStatus.textContent=
"Sẵn sàng quét mã cuộn";

await startScanner();

}

startBtn.addEventListener(
"click",
startScanner
);

flashBtn.addEventListener(
"click",
toggleTorch
);

submitBtn.addEventListener(
"click",
submitData
);

newRollBtn.addEventListener(
"click",
newRoll
);

window.addEventListener(
"beforeunload",
()=>{

if(scanner&&scanning){

try{

scanner.stop();

}catch(e){}

}

}
);

</script>

</body>
</html>
